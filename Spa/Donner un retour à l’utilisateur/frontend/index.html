
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestion des véhicules</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-800 min-h-screen">

    <!-- Container principal : Mobile First -->
    <div class="flex flex-col md:flex-row min-h-screen">

        <!-- Sidebar : cachée sur mobile, visible sur tablette et PC -->
        <aside class="hidden md:block w-64 shrink-0 bg-slate-900 text-white p-6">

            <h2 class="text-2xl font-bold mb-8">
                Gestion Auto
            </h2>

            <nav class="space-y-2">
                <a
                    href="#vehicleForm"
                    class="block py-3 px-4 bg-slate-800 rounded-lg hover:bg-slate-700 transition"
                >
                    Gestion des véhicules
                </a>

                <a
                    href="#vehiclesList"
                    class="block py-3 px-4 rounded-lg hover:bg-slate-800 transition"
                >
                    Liste des véhicules
                </a>
            </nav>

        </aside>

        <!-- Contenu principal -->
        <main class="flex-1 min-w-0 p-4 sm:p-6 md:p-8">

            <!-- Header -->
            <header class="mb-6 md:mb-8">
                <h1 class="text-2xl sm:text-3xl font-bold">
                    Gestion des véhicules
                </h1>

                <p class="text-gray-600 mt-2">
                    Ajoutez et consultez vos véhicules.
                </p>
            </header>

            <!-- Formulaire responsive -->
            <section class="mb-8">

                <h2 class="text-xl font-semibold mb-4">
                    Ajouter un véhicule
                </h2>

                <form
                    id="vehicleForm"
                    class="bg-white p-4 sm:p-6 rounded-lg shadow grid grid-cols-1 md:grid-cols-2 gap-4"
                >

                    <!-- Marque -->
                    <div class="min-w-0">
                        <label
                            for="marque"
                            class="block text-sm font-medium mb-2"
                        >
                            Marque
                        </label>

                        <input
                            type="text"
                            id="marque"
                            placeholder="Ex : Toyota"
                            class="border border-gray-300 p-3 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
                            required
                        >
                    </div>

                    <!-- Modèle -->
                    <div class="min-w-0">
                        <label
                            for="modele"
                            class="block text-sm font-medium mb-2"
                        >
                            Modèle
                        </label>

                        <input
                            type="text"
                            id="modele"
                            placeholder="Ex : Corolla"
                            class="border border-gray-300 p-3 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
                            required
                        >
                    </div>

                    <!-- Année -->
                    <div class="min-w-0">
                        <label
                            for="annee"
                            class="block text-sm font-medium mb-2"
                        >
                            Année
                        </label>

                        <input
                            type="number"
                            id="annee"
                            placeholder="Ex : 2024"
                            class="border border-gray-300 p-3 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
                            required
                        >
                    </div>

                    <!-- Bouton -->
                    <div class="md:col-span-2">
                        <button
                            type="submit"
                            id="btn-submit-form"
                            class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-3 rounded-lg transition disabled:opacity-50"
                        >
                            Ajouter
                        </button>
                    </div>

                </form>

            </section>

            <!-- Liste des véhicules -->
            <section>

                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 mb-4">

                    <h2 class="text-xl font-semibold">
                        Liste des véhicules
                    </h2>

                    <span class="text-sm text-gray-500">
                        Véhicules enregistrés
                    </span>

                </div>

                <!-- Grille responsive des véhicules -->
                <div
                    id="vehiclesList"
                    class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4"
                >
                    <!-- Les véhicules seront affichés ici par main.js -->
                </div>

            </section>

        </main>

    </div>

    <!-- Conteneur des notifications Toast -->
    <div
        id="toast-container"
        class="fixed bottom-4 right-4 left-4 sm:left-auto z-50 flex flex-col gap-2"
    ></div>

    <!-- JavaScript existant -->
    <script src="main.js"></script>

</body>
</html>
